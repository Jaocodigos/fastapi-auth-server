<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Login • Authorization Server</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#7c3aed",   // roxo
            primaryDark: "#5b21b6",
            surface: "#0f172a",   // quase preto
            surfaceLight: "#020617"
          }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-black via-surface to-surfaceLight flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-surface/90 backdrop-blur rounded-2xl shadow-2xl border border-white/10 p-8">

    <!-- Header -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-white">
        Sign In
      </h1>
      <p class="text-sm text-gray-400 mt-2">
        {{ client_name or "Application" }}
      </p>
    </div>

    {% if error %}
      <div class="mb-6 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 text-sm">
        {{ error }}
      </div>
    {% endif %}

    <!-- Form -->
    <form method="post" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">
          Username
        </label>
        <input
          name="username"
          required
          autofocus
          class="w-full rounded-lg bg-black/40 border border-white/10 px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition"
          placeholder="John123"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">
          Password
        </label>
        <input
          type="password"
          name="password"
          required
          class="w-full rounded-lg bg-black/40 border border-white/10 px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="w-full mt-4 rounded-lg bg-primary py-2.5 text-white font-semibold hover:bg-primaryDark focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-black transition"
      >
        Entrar
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-8 text-center text-xs text-gray-500">
      OAuth 2.0 • OpenID
        <br>
        <a
      href="https://github.com/Jaocodigos"
      target="_blank"
      rel="noopener noreferrer"
      class="text-gray-400 hover:text-primary transition"
      >Jaocodigos</a>
    </div>


  </div>


</body>
</html>
